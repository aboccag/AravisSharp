name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs that need more (release-sources: contents write; publish: id-token) ask for it themselves.
permissions:
  contents: read

# A newer push to a pull request supersedes its running build; pushes to main and tags run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared meson options — disable everything not needed for the .NET binding
env:
  MESON_OPTS: >-
    --buildtype=release
    -Dviewer=disabled
    -Dtests=false
    -Ddocumentation=disabled
    -Dintrospection=disabled
    -Dgst-plugin=disabled

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build native Aravis on every target platform
  # ─────────────────────────────────────────────────────────────────────────
  # Each platform collects its payload with a script under .github/scripts/ that derives
  # the dependency set from the built binary, then a separate script checks the payload is
  # self-contained. Both fail the job rather than ship a runtime that only loads here.
  build-native:
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # - { os: macos-13,         rid: osx-x64     }  # disabled: macos-13 runners have hour-long queues
          - { os: macos-latest,     rid: osx-arm64   }
          - { os: windows-latest,   rid: win-x64     }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Aravis source version
        shell: bash
        run: .github/scripts/check-aravis-version.sh

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        # jq: record-native-versions.sh reads each bundled formula's source from brew info.
        run: brew install glib libxml2 libusb meson ninja pkg-config jq

      - name: Build Aravis (macOS)
        if: runner.os == 'macOS'
        run: |
          # Homebrew libxml2 is keg-only — expose its pkg-config path
          libxml2_prefix="$(brew --prefix libxml2)"
          export PKG_CONFIG_PATH="$libxml2_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          meson setup _build aravis ${{ env.MESON_OPTS }} --prefix="$PWD/_install"
          ninja -C _build install

      - name: Collect and fix native libs (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/collect-native-macos.sh _native _native-sources.txt

      - name: Verify native payload (macOS)
        if: runner.os == 'macOS'
        run: .github/scripts/verify-native-macos.sh _native

      # ── Windows (MSYS2 / MinGW64) ──────────────────────────────────────────
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config

      - name: Build Aravis (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: |
          meson setup _build aravis ${{ env.MESON_OPTS }} --prefix=/mingw64
          ninja -C _build install

      - name: Collect native DLLs (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: .github/scripts/collect-native-windows.sh _native

      - name: Verify native payload (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: .github/scripts/verify-native-windows.sh _native

      # ── All platforms ──────────────────────────────────────────────────────
      - name: Record bundled versions
        if: runner.os != 'Windows'
        run: .github/scripts/record-native-versions.sh _native _native-sources.txt

      - name: Record bundled versions (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: .github/scripts/record-native-versions.sh _native

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: _native/
          if-no-files-found: error

  # Linux builds in an ubuntu:20.04 container on both architectures: Aravis selects GLib
  # APIs at compile time, so the GLib it is built against (2.64 there) is the oldest it
  # loads on. libxml2 is linked in statically, since its soname differs between distros.
  build-native-linux:
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     rid: linux-x64   }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout: without git in the container, actions/checkout falls back to a
      # tarball download that has no submodules.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends             git ca-certificates curl xz-utils make gcc g++ binutils patchelf             python3-pip ninja-build pkg-config             libglib2.0-dev libusb-1.0-0-dev zlib1g-dev
          # focal's meson is 0.53; Aravis requires >= 0.57
          pip3 install meson==1.5.2

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Aravis source version
        run: .github/scripts/check-aravis-version.sh

      - name: Build libxml2 (static) and Aravis
        run: .github/scripts/build-native-linux.sh

      - name: Collect native libs
        run: .github/scripts/collect-native-linux.sh _native

      - name: Verify native payload
        run: .github/scripts/verify-native-linux.sh _native

      - name: Record bundled versions
        run: .github/scripts/record-native-versions.sh _native

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: _native/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build .NET and run the whole suite against the fake camera (no hardware)
  # ─────────────────────────────────────────────────────────────────────────
  test-dotnet:
    name: Test .NET (Fake interface)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Aravis system-wide for test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev libxml2-dev libusb-1.0-0-dev \
            meson ninja-build pkg-config
          meson setup _build aravis \
            --buildtype=release --prefix=/usr/local \
            -Dviewer=disabled -Dtests=false -Ddocumentation=disabled \
            -Dintrospection=disabled -Dgst-plugin=disabled
          sudo ninja -C _build install
          sudo ldconfig

      # The runner has no camera, so every test runs against the fake interface: the suite
      # only opens real hardware when ARAVIS_TEST_DEVICE_ID names a device.
      - name: Run test suite
        run: |
          dotnet test AravisSharp.Tests/ -c Release \
            --logger "console;verbosity=normal"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Assemble the all-in-one NuGet package
  # ─────────────────────────────────────────────────────────────────────────
  pack:
    name: Pack NuGet
    needs: [build-native, build-native-linux, test-dotnet]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Download all native artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _native/

      # Lay them out under AravisSharp/runtimes/{rid}/native/
      # dotnet pack will pick them up via the <Content> items in the csproj
      - name: Arrange runtimes layout
        run: |
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            src=_native/native-$rid
            if [ ! -d "$src" ]; then
              echo "::error::no native artifact for $rid"
              exit 1
            fi
            dest=AravisSharp/runtimes/$rid/native
            mkdir -p "$dest"
            cp -r "$src/." "$dest/"
          done
          find AravisSharp/runtimes -type f | sort

      # A new transitive dependency must not ship before its license has been reviewed.
      - name: Check every bundled library is covered by the notices
        run: |
          missing=0
          for f in AravisSharp/runtimes/*/native/*; do
            name=$(basename "$f")
            [ "$name" = aravis-native-versions.txt ] && continue
            if ! grep -qF "\`$name\`" THIRD-PARTY-NOTICES.md; then
              echo "::error::$f is bundled but not listed in THIRD-PARTY-NOTICES.md"
              missing=1
            fi
          done
          exit "$missing"

      # On a tag push use the tag (strip leading 'v'); otherwise a native-versioned CI pre-release.
      # The tag must agree with the csproj: v<AravisNativeVersion> when AravisSharpPatchVersion
      # is 0, v<AravisNativeVersion>.<AravisSharpPatchVersion> otherwise.
      - name: Compute package version
        id: ver
        run: |
          get_property() {
            dotnet msbuild AravisSharp/AravisSharp.csproj -getProperty:"$1" | tail -n 1 | tr -d '\r'
          }
          native_version="$(get_property AravisNativeVersion)"
          csproj_patch="$(get_property AravisSharpPatchVersion)"
          if [[ -z "$native_version" ]]; then
            echo "::error::Could not determine AravisNativeVersion"
            exit 1
          fi
          if [[ ! "$csproj_patch" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Could not determine AravisSharpPatchVersion (got '$csproj_patch')"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            native_version_regex="${native_version//./\\.}"
            if [[ "$version" == "$native_version" ]]; then
              patch_version="0"
            elif [[ "$version" =~ ^${native_version_regex}\.([1-9][0-9]*)$ ]]; then
              patch_version="${BASH_REMATCH[1]}"
            else
              echo "::error::Release tag v$version must match Aravis native version $native_version. Use v$native_version or v$native_version.N where N >= 1 for same-native patch fixes."
              exit 1
            fi
            if [[ "$patch_version" != "$csproj_patch" ]]; then
              echo "::error::Release tag v$version has patch component $patch_version but AravisSharp.csproj sets AravisSharpPatchVersion=$csproj_patch. Update the csproj or retag."
              exit 1
            fi
          else
            patch_version="$csproj_patch"
            if [[ "$patch_version" == "0" ]]; then
              version="$native_version-ci.${GITHUB_RUN_NUMBER}"
            else
              version="$native_version.$patch_version-ci.${GITHUB_RUN_NUMBER}"
            fi
          fi

          {
            echo "version=$version"
            echo "native_version=$native_version"
            echo "patch_version=$patch_version"
          } >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack AravisSharp/AravisSharp.csproj \
            -c Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:PackageVersion=${{ steps.ver.outputs.version }} \
            -p:AravisSharpPatchVersion=${{ steps.ver.outputs.patch_version }} \
            -p:BuildInParallel=false \
            -o _packages/

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          # The .snupkg must travel with the .nupkg: `dotnet nuget push` picks up the sibling symbols package.
          path: |
            _packages/*.nupkg
            _packages/*.snupkg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Install the package on each platform and acquire frames with it
  # ─────────────────────────────────────────────────────────────────────────
  # Tests what ships rather than what compiles: a clean runner with no Aravis installed
  # restores the .nupkg like a user would and runs the fake camera through it.
  package-smoke:
    name: Package smoke (${{ matrix.rid }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     rid: linux-x64   }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
          - { os: macos-latest,     rid: osx-arm64   }
          - { os: windows-latest,   rid: win-x64     }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # A private package folder, so nothing cached on the runner can stand in for the package.
      NUGET_PACKAGES: ${{ github.workspace }}/_nuget-smoke
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: _packages/

      # Linux uses the distribution's GLib and libusb; Aravis (with libxml2 in it) must come from the package.
      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libusb-1.0-0
          if ldconfig -p | grep libaravis >/dev/null; then
            echo "::error::a system Aravis is installed and would mask the packaged one"
            exit 1
          fi

      # The macOS payload must not depend on Homebrew: remove what the build job linked against.
      - name: Remove Homebrew copies of the bundled libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          for formula in glib libxml2 libusb gettext pcre2; do
            brew uninstall --ignore-dependencies --force "$formula" 2>/dev/null || true
          done
          if ls "$(brew --prefix)"/opt/{glib,libxml2,libusb}/lib/*.dylib 2>/dev/null; then
            echo "::error::Homebrew copies are still present and would mask missing bundled libraries"
            exit 1
          fi

      - name: Acquire frames through the package
        run: |
          for tfm in net8.0 net10.0; do
            dotnet run --project .github/package-smoke -c Release -f "$tfm" \
              -p:AravisSharpVersion=${{ needs.pack.outputs.version }}
          done

  # The runners above are Ubuntu 22.04. Check the two ends of the supported range in bare
  # images: the oldest (GLib 2.64, glibc 2.31) and the newest LTS, whose libxml2 soname
  # (.so.16) differs from the older distributions' (.so.2).
  package-smoke-distros:
    name: Package smoke (${{ matrix.rid }}, ${{ matrix.image }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     rid: linux-x64,   image: 'ubuntu:20.04' }
          - { os: ubuntu-22.04,     rid: linux-x64,   image: 'ubuntu:26.04' }
          - { os: ubuntu-22.04-arm, rid: linux-arm64, image: 'ubuntu:20.04' }
          - { os: ubuntu-22.04-arm, rid: linux-arm64, image: 'ubuntu:26.04' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/_nuget-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: _packages/

      # Self-contained, so the image needs no .NET; net8.0 is supported on every image here.
      - name: Publish the smoke app
        run: |
          dotnet publish .github/package-smoke -c Release -f net8.0 -r ${{ matrix.rid }}             --self-contained -p:AravisSharpVersion=${{ needs.pack.outputs.version }} -o _smoke

      - name: Acquire frames in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/_smoke:/app:ro"             -v "$PWD/.github/package-smoke/run-in-container.sh:/run.sh:ro"             ${{ matrix.image }} bash /run.sh

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Attach the corresponding source of the bundled libraries to the release
  # ─────────────────────────────────────────────────────────────────────────
  # The package bundles LGPL libraries (Aravis, GLib, libusb, libintl, libiconv) whose
  # MSYS2 and Homebrew builds are dropped from those repositories once superseded. Every
  # source recorded in the native artifacts' aravis-native-versions.txt is downloaded, plus
  # a git archive of the aravis submodule, and attached to the tag's GitHub Release (created
  # as a draft if missing). Any source that cannot be fetched fails the job, and publish.
  # A re-run attaches nothing new, and fails if the release already carries the sources of
  # a build that bundled other versions (see attach-release-sources.sh).
  release-sources:
    name: Release sources
    needs: pack   # pack has checked the tag against the csproj version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      # No token left in .git/config: this job holds contents: write, and only the attach
      # step needs it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _native/

      - name: Fetch the corresponding sources
        run: .github/scripts/fetch-release-sources.sh _native _release-sources

      - name: Attach them to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: .github/scripts/attach-release-sources.sh "$TAG" _release-sources

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Publish the package that passed the smoke test, on a release tag
  # ─────────────────────────────────────────────────────────────────────────
  # nuget.org Trusted Publishing: no stored API key. The job exchanges its GitHub OIDC token
  # for a nuget.org key valid one hour, under the policy set on nuget.org for this
  # repository and workflow file (build-and-publish.yml). Off until the repository
  # variable NUGET_PUBLISH is 'true'; NUGET_USER holds the nuget.org profile name.
  # Runs in the nuget-release environment, whose required reviewer approves each push. The
  # environment name is in the OIDC token, so the Trusted Publishing policy on nuget.org
  # must name it (environment: nuget-release) too.
  # Needs release-sources: a package never ships without its sources attached to the release.
  publish:
    name: Publish NuGet
    needs: [pack, package-smoke, package-smoke-distros, release-sources]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: nuget-release
    timeout-minutes: 30
    permissions:
      id-token: write   # GitHub OIDC token for nuget.org
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: _packages/

      # Right before the push: the temporary key expires after an hour.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushes each .nupkg and, from the same folder, its .snupkg. No --skip-duplicate: pushing
      # a version nuget.org already has must fail the release rather than pass silently.
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          ls -l _packages/
          dotnet nuget push "_packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
